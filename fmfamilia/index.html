html,body{height:100%;margin:0}

#nx{display:block;font-size:26px;line-height:30px}

button{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:9px 22px;font-size:15px;font-weight:600}
#evo{width:min(100vw,calc((100dvh - 205px) * .6538));display:flex;flex-direction:column;align-items:center;gap:5px;margin:2px 0}.row{display:flex;align-items:center;justify-content:center;gap:2px;width:100%}.e{flex:1 1 0;max-width:38px;aspect-ratio:1;transition:transform .2s,opacity .2s;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,5.6vw,22px)}.a{font-size:9px;opacity:.5;width:5px;text-align:center}.e.off{opacity:.3}.e.hi{transform:scale(1.25);box-shadow:0 0 0 2px var(--fg);z-index:1}canvas{transition:transform .5s ease}#bt{display:flex;gap:16px;align-items:center;justify-content:center}#rs,#mn{padding:6px 14px;font-size:12px;border-radius:8px}.sw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer}.sw input{display:none}.tg{width:34px;height:20px;border-radius:10px;background:var(--edge);position:relative;transition:background .2s}.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}.sw input:checked+.tg{background:var(--btn)}.sw input:checked+.tg::after{transform:translateX(14px)}button:disabled{opacity:.4}

#menu.hide{display:none}
#mv,#rv,#tv,#lv,#av,#sv{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(86vw,320px)}
#mv[hidden],#rv[hidden],#tv[hidden],#lv[hidden],#av[hidden],#sv[hidden]{display:none}
#mv,#rv,#tv,#ev,#lv,#av,#sv{box-sizing:border-box;padding:18px;border-radius:22px;background:color-mix(in srgb,var(--box) 90%,transparent);border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:calc(100dvh - 32px);overflow-y:auto}
#mv{align-self:flex-end;margin-bottom:max(22px,env(safe-area-inset-bottom,0px))}
#mv h1{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;margin:0;padding:0 12px;text-align:center;line-height:1;font-family:ui-rounded,"Arial Rounded MT Bold","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;font-weight:900;letter-spacing:.01em;pointer-events:none}
#mv h1 span{display:block;font-size:clamp(40px,13vw,60px);color:#ff5a3c;text-shadow:0 0 0 #fff,3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 7px 0 #b8341f,0 10px 14px rgba(0,0,0,.3)}
#mv h1 span+span{margin-top:8px;font-size:clamp(22px,7vw,32px);color:#3aa64a;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 5px 0 #1f6e2c,0 8px 10px rgba(0,0,0,.25)}
#mv h1 .y{color:#ffb300}
#menu h2{margin:0;font-size:30px}
#lu,#lp{width:100%;box-sizing:border-box;padding:12px 14px;font-size:17px;border-radius:12px;border:2px solid var(--edge);background:var(--box);color:var(--fg);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
#pl{width:100%;padding:16px;font-size:22px;border-radius:14px}
#tm,#rk,#bk,#tb,#lg,#lr,#lb,#ab,#sb{width:100%;padding:12px;font-size:16px;border-radius:12px;background:var(--box);color:var(--fg);border:2px solid var(--edge)}
#rst{font-size:12px;opacity:.65;margin-top:-8px}#rl{width:100%;margin:0;padding:0;list-style:none}
#rl li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--box);margin-bottom:6px}
#rl li span{width:26px;opacity:.6}
#rl li b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rl li i{font-style:normal;font-weight:700}#rl li em{font-style:normal;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
#rl li:first-child{outline:2px solid var(--btn)}
#tl{width:100%;display:flex;flex-direction:column;gap:10px}.tc{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:12px;background:var(--box);color:var(--fg);border:2px solid var(--edge);font-size:15px}.tc.sel{border-color:var(--btn);box-shadow:0 0 0 2px var(--btn)}.tc span{font-size:16px;line-height:20px;letter-spacing:1px}.tc img{width:18px;height:18px;vertical-align:middle}
#go .alt{background:transparent;border:2px solid #fff;font-size:15px;padding:8px 22px}#bg.on{outline:3px solid var(--fg)}#wrap{position:relative;line-height:0}#go{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.65);border-radius:14px;color:#fff;line-height:1.2;text-align:center}#go.show{display:flex}#go h2{margin:0;font-size:32px}#go p{margin:0 0 6px;font-size:18px}#go button{font-size:18px;padding:12px 26px}#tools{display:flex;flex-direction:column;gap:4px}#tools button{padding:5px 9px;font-size:11px;border-radius:8px;white-space:nowrap}#tools button.on{outline:3px solid var(--fg)}
#xp{cursor:pointer;color:var(--fg);font:inherit;text-align:left;position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;transform:translateX(-50%);width:min(86vw,320px);display:flex;flex-direction:column;gap:5px;box-sizing:border-box;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--box) 85%,transparent);border:2px solid #fff}#mv[hidden]~#xp{display:none}
#xp .xt{display:block}
.xr{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;letter-spacing:.04em}.xr span{opacity:.7;font-weight:600}
.xt{height:12px;border-radius:8px;background:var(--box);border:2px solid var(--edge);overflow:hidden}.xt i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--btn),#ffc46b);transition:width .4s}
#ev{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(92vw,360px)}#ev[hidden]{display:none}
#ev p{margin:0;font-size:13px;opacity:.7;text-align:center;line-height:1.35}
#eg{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:4px}
.sl{position:relative;aspect-ratio:1;border-radius:50%;background:var(--box);border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,28px);cursor:pointer}.sl.fill{border-color:var(--btn)}
.sl img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.sl em{position:absolute;left:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--btn);color:#fff;font:700 11px/18px system-ui,sans-serif;text-align:center;z-index:2}
.sl u{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--line);color:#fff;font:700 11px/22px system-ui,sans-serif;text-align:center;text-decoration:none;z-index:2}
#eb{width:100%;padding:12px;font-size:16px;border-radius:12px;background:var(--box);color:var(--fg);border:2px solid var(--edge)}
.tc img{border-radius:50%;object-fit:cover}
.tc{position:relative}.tc u{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--line);color:#fff;font:700 12px/24px system-ui,sans-serif;text-decoration:none}
#sp,#spo{width:100%;padding:12px;font-size:16px;border-radius:12px}#spb{width:100%;display:flex;flex-direction:column;gap:8px}#spb[hidden]{display:none}#spb div{display:flex;gap:8px}#spb div button{flex:1}#spc{background:var(--box);color:var(--fg);border:2px solid var(--edge)}
#spn{width:100%;box-sizing:border-box;padding:11px 14px;font-size:16px;border-radius:12px;border:2px solid var(--edge);background:var(--bg);color:var(--fg);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
#lg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}#lg.in{border-color:#3aa64a}
#li{width:100%;padding:14px;font-size:18px;border-radius:12px}#le{margin:-4px 0;font-size:13px;color:var(--line);text-align:center}#le:empty{display:none}
#lo{width:100%;padding:14px;font-size:17px;border-radius:12px;background:var(--line)}#an{margin:0;font-size:14px;opacity:.7;text-align:center}
#onl{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 13px;border-radius:20px;background:rgba(0,0,0,.45);color:#fff;font:700 14px/1 system-ui,sans-serif;letter-spacing:.03em}
#onl i{width:10px;height:10px;border-radius:50%;background:#2ee66b;box-shadow:0 0 6px 2px rgba(46,230,107,.8);animation:onb 2s ease-in-out infinite}
@keyframes onb{50%{box-shadow:0 0 2px 1px rgba(46,230,107,.5)}}
#stl{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}.stc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:12px;background:var(--box);border:2px solid var(--edge);text-align:center}.stc span{font-size:26px;line-height:1}.stc b{font-size:19px;font-variant-numeric:tabular-nums}.stc small{font-size:11px;opacity:.75;line-height:1.2}
#sn{margin:0;font-size:12px;opacity:.7;text-align:center}.sw[hidden]{display:none}#rec{cursor:pointer}
.ib{position:relative;width:48px;height:48px;padding:0;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--box);border:2px solid var(--edge);color:var(--fg)}

#hud>div{text-align:center}
#hud .sd{display:flex;flex-direction:column;gap:6px;align-items:center}
#hud .ib{width:38px;height:38px;border-radius:12px}

#bt{gap:36px}
#bt .ib{width:38px;height:38px;border-radius:12px}

#bt .bd{width:auto}
#hud .sd{position:relative}

#vol .x{display:none}#vol.m .w{display:none}#vol.m .x{display:inline}#vol.on{outline:3px solid var(--fg)}
#lg,#onl{display:none!important}

}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function fruit(x,y,l,r,pop){
  const R=r*(1+0.12*(pop||0)),it=F[l];
  ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fillStyle=it[2];ctx.fill();
  if(it[3])planet(ctx,x,y,R,it[3]);
  else if(it[4]!=null&&it[5].i[it[4]]&&it[5].i[it[4]].complete&&it[5].i[it[4]].naturalWidth){ctx.save();ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.clip();ctx.drawImage(it[5].i[it[4]],x-R,y-R,2*R,2*R);ctx.restore()}
  else{ctx.font=Math.round(R*1.25)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it[0],x,y+R*0.05)}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=css('--box');ctx.fillRect(0,0,W,H);
  if(bgOn){const im=BG[bgI];if(im&&im.complete&&im.naturalWidth){ctx.drawImage(im,0,0,W,H);ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,0,W,H)}}
  ctx.strokeStyle=css('--line');ctx.setLineDash([8,6]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();ctx.setLineDash([]);
  if(!over&&ready&&!flipping&&!picking){
    const r=F[cur][1],x=Math.max(r,Math.min(W-r,aim));
    ctx.strokeStyle=css('--edge');ctx.globalAlpha=.5;ctx.setLineDash([3,6]);
    ctx.beginPath();ctx.moveTo(x,r+8);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    fruit(x,r+8,cur,r);
  }
  for(const b of B)fruit(b.x,b.y,b.l,b.r,b.pop);
  ctx.save();ctx.globalAlpha=.28;ctx.fillStyle=css('--fg');ctx.font='600 13px ui-monospace,Menlo,Consolas,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(fmt(gt),W/2,15);ctx.restore();
  if(picking){
    let hv=-1;for(let i=B.length-1;i>=0;i--){if(Math.hypot(B[i].x-aim,B[i].y-ay)<=B[i].r){hv=B[i].l;break}}
    if(hv>=0){ctx.strokeStyle='#fff';ctx.lineWidth=3;for(const b of B)if(b.l===hv){ctx.beginPath();ctx.arc(b.x,b.y,b.r+2,0,7);ctx.stroke()}}
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,30);ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Toque na fruta que quer limpar',W/2,15);
  }
}
let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(t-last,100);last=t;
  while(acc>=16.67){if(!over&&!inMenu){step();gt+=16.67}acc-=16.67}
  draw();requestAnimationFrame(loop);
}
buildEvo();
drawXP();drawLogin();beat();
reset();requestAnimationFrame(loop);
